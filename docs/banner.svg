<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'DejaVu Sans', 'Liberation Sans', 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="68%" cy="42%" r="85%">
      <stop offset="0" stop-color="#16306b"/><stop offset=".45" stop-color="#0a1736"/><stop offset="1" stop-color="#050a1a"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a3d" stop-opacity=".95"/><stop offset="1" stop-color="#081128" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#f29a3c"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b82f6" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Circuit traces and stars -->
  <g fill="none" stroke="#3b82f6" stroke-opacity=".35" stroke-width="1.5">
    <path d="M0 96h70l18 18h60"/><path d="M0 610h120l16-16h40"/><path d="M1280 560h-90l-14 14h-50"/>
    <path d="M1280 190h-60l-12-12h-36"/><path d="M560 60h60l10 10h50"/>
  </g>
  <g fill="#93c5fd">
    <circle cx="148" cy="114" r="3"/><circle cx="176" cy="594" r="3"/><circle cx="1126" cy="574" r="3"/><circle cx="1172" cy="178" r="3"/><circle cx="680" cy="70" r="3"/>
    <circle cx="420" cy="40" r="1.5" opacity=".7"/><circle cx="760" cy="120" r="1.5" opacity=".6"/><circle cx="1010" cy="60" r="1.5" opacity=".7"/>
    <circle cx="610" cy="640" r="1.5" opacity=".5"/><circle cx="300" cy="680" r="1.5" opacity=".6"/><circle cx="940" cy="668" r="1.5" opacity=".6"/>
  </g>

  <!-- Title -->
  <g filter="url(#glowRed)">
    <text x="64" y="128" font-size="88" font-weight="700" letter-spacing="-3" fill="#1d4ed8" stroke="#ff4d5a" stroke-width="3" paint-order="stroke">rema1000-dk</text>
  </g>
  <text x="68" y="176" font-size="26" fill="#e2e8f0">Uofficiel Python-klient til den danske REMA 1000-app.</text>
  <text x="68" y="208" font-size="21" fill="#93a4c4">Indkøbslister · favoritter · varekatalog</text>

  <!-- Feature chips, top right -->
  <g font-size="19" font-weight="700" fill="#bfdbfe" text-anchor="middle">
    <g fill="#0c1a3d" stroke="#3b82f6" stroke-opacity=".7" stroke-width="1.5">
      <rect x="892" y="40" width="96" height="52" rx="12"/><rect x="1000" y="40" width="96" height="52" rx="12"/><rect x="1108" y="40" width="108" height="52" rx="12"/>
    </g>
    <text x="940" y="73">API</text><text x="1048" y="73">PKCE</text><text x="1162" y="73">JSON</text>
  </g>

  <!-- Terminal -->
  <g filter="url(#glowBlue)">
    <rect x="56" y="244" width="640" height="344" rx="18" fill="url(#panel)" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <circle cx="84" cy="270" r="6" fill="#ff5f57"/><circle cx="104" cy="270" r="6" fill="#3b82f6"/><circle cx="124" cy="270" r="6" fill="#38bdf8"/>
  <g font-family="'Cascadia Mono', 'Consolas', 'DejaVu Sans Mono', monospace" font-size="18.5">
    <text x="82" y="318"><tspan fill="#94a3b8">$ </tspan><tspan fill="#e2e8f0">python rema1000.py </tspan><tspan fill="#86efac">login</tspan></text>
    <text x="82" y="346" fill="#4ade80">  ✓ Logget ind</text>
    <text x="82" y="388"><tspan fill="#94a3b8">$ </tspan><tspan fill="#e2e8f0">python rema1000.py </tspan><tspan fill="#86efac">catalog</tspan><tspan fill="#7dd3fc"> --search </tspan><tspan fill="#fde68a">"letmælk"</tspan></text>
    <text x="82" y="416" fill="#cbd5e1">  20494  10.95 kr.  LETMÆLK 1,5% FEDT</text>
    <text x="82" y="442" fill="#cbd5e1">  20500  12.50 kr.  LETMÆLK 1,5%</text>
    <text x="82" y="484"><tspan fill="#94a3b8">$ </tspan><tspan fill="#e2e8f0">python rema1000.py </tspan><tspan fill="#86efac">add</tspan><tspan fill="#fde68a"> 1234567 20494</tspan><tspan fill="#7dd3fc"> --amount </tspan><tspan fill="#fde68a">2</tspan></text>
    <text x="82" y="512" fill="#4ade80">  ✓ Lagt på listen</text>
    <text x="82" y="554"><tspan fill="#94a3b8">$ </tspan><tspan fill="#e2e8f0">▍</tspan></text>
  </g>

  <!-- Shopping list card -->
  <g filter="url(#glowBlue)">
    <rect x="724" y="392" width="268" height="214" rx="16" fill="url(#panel)" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="746" y="428" font-size="20" font-weight="800" fill="#e0f2fe" letter-spacing="1">UGE 41</text>
  <text x="972" y="428" font-size="16" fill="#7dd3fc" text-anchor="end">3 varer</text>
  <path d="M746 442H972" stroke="#38bdf8" stroke-opacity=".4"/>
  <g font-size="19" fill="#e2e8f0">
    <g fill="none" stroke="#38bdf8" stroke-width="2"><rect x="746" y="458" width="20" height="20" rx="5"/><rect x="746" y="494" width="20" height="20" rx="5"/><rect x="746" y="530" width="20" height="20" rx="5"/></g>
    <path d="M750 468l5 5 8-10M750 504l5 5 8-10" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="780" y="475">2 × Letmælk</text><text x="972" y="475" text-anchor="end" fill="#93c5fd">21,90</text>
    <text x="780" y="511">Rugbrød</text><text x="972" y="511" text-anchor="end" fill="#93c5fd">14,95</text>
    <text x="780" y="547">Fryseposer</text><text x="972" y="547" text-anchor="end" fill="#93c5fd">13,95</text>
  </g>
  <text x="972" y="588" font-size="18" font-weight="800" fill="#e0f2fe" text-anchor="end">I alt 50,80 kr.</text>

  <!-- The robot: holds the list and waves -->
  <g transform="translate(1118 380)">
    <!-- hover ring -->
    <ellipse cx="0" cy="232" rx="132" ry="16" fill="none" stroke="#38bdf8" stroke-opacity=".8" stroke-width="2"/>
    <ellipse cx="0" cy="232" rx="92" ry="10" fill="#38bdf8" opacity=".2"/>
    <ellipse cx="0" cy="232" rx="170" ry="24" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-width="1.5"/>
    <!-- legs -->
    <rect x="-44" y="150" width="34" height="62" rx="15" fill="#c7d6ee"/><rect x="10" y="150" width="34" height="62" rx="15" fill="#c7d6ee"/>
    <rect x="-52" y="196" width="50" height="26" rx="12" fill="#1d4ed8"/><rect x="2" y="196" width="50" height="26" rx="12" fill="#1d4ed8"/>
    <!-- left arm, holding the list -->
    <path d="M-66 64 Q-112 84 -128 116" fill="none" stroke="#c7d6ee" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-130" cy="120" r="16" fill="#e8eefb"/>
    <!-- right arm, waving -->
    <path d="M66 62 Q118 44 128 -6" fill="none" stroke="#c7d6ee" stroke-width="22" stroke-linecap="round"/>
    <circle cx="130" cy="-14" r="17" fill="#e8eefb"/>
    <g stroke="#e8eefb" stroke-width="9" stroke-linecap="round"><path d="M122 -26L114 -44"/><path d="M132 -30L134 -50"/><path d="M142 -24L154 -40"/></g>
    <!-- body -->
    <rect x="-70" y="38" width="140" height="128" rx="44" fill="#e8eefb"/>
    <path d="M-70 96 Q0 118 70 96 V122 Q70 166 26 166 H-26 Q-70 166 -70 122 Z" fill="#1d4ed8"/>
    <rect x="-30" y="62" width="60" height="44" rx="12" fill="#0b1632" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-16 84h8l5-10 7 20 5-10h8" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-44" cy="60" r="5" fill="#ff4d5a"/><circle cx="44" cy="60" r="5" fill="#38bdf8"/>
    <!-- neck -->
    <rect x="-18" y="22" width="36" height="22" rx="8" fill="#9fb3d6"/>
    <!-- head -->
    <path d="M0 -112V-134" stroke="#9fb3d6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-140" r="9" fill="#ff4d5a"/><circle cx="0" cy="-140" r="16" fill="#ff4d5a" opacity=".25"/>
    <rect x="-98" y="-112" width="196" height="142" rx="62" fill="#e8eefb"/>
    <rect x="-112" y="-66" width="22" height="50" rx="10" fill="#1d4ed8"/><rect x="90" y="-66" width="22" height="50" rx="10" fill="#1d4ed8"/>
    <rect x="-108" y="-52" width="8" height="22" rx="4" fill="#38bdf8"/><rect x="100" y="-52" width="8" height="22" rx="4" fill="#38bdf8"/>
    <rect x="-78" y="-90" width="156" height="98" rx="44" fill="#070d1f"/>
    <g filter="url(#glowBlue)">
      <ellipse cx="-34" cy="-46" rx="15" ry="19" fill="#38bdf8"/><ellipse cx="34" cy="-46" rx="15" ry="19" fill="#38bdf8"/>
      <path d="M-20 -14 Q0 2 20 -14" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <ellipse cx="-30" cy="-52" rx="5" ry="6" fill="#e0f2fe"/><ellipse cx="38" cy="-52" rx="5" ry="6" fill="#e0f2fe"/>
    <path d="M-64 -78 Q-20 -98 30 -92" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(738 268)">
    <path d="M0 14a14 14 0 0 1 14-14h206a14 14 0 0 1 14 14v22l26 12-26 6v12a14 14 0 0 1-14 14H14a14 14 0 0 1-14-14z" fill="#0c1a3d" stroke="#38bdf8" stroke-width="2"/>
    <text x="117" y="34" font-size="19" fill="#e0f2fe" text-anchor="middle">Hvad mangler vi?</text>
    <text x="117" y="60" font-size="19" fill="#7dd3fc" text-anchor="middle">JSON ind, JSON ud.</text>
  </g>

  <!-- Bottom bar -->
  <path d="M56 628H1224" stroke="#3b82f6" stroke-opacity=".5"/>
  <g font-size="16" font-weight="700" fill="#cbd5e1" letter-spacing="1.2">
    <text x="64" y="667">ÉN FIL · PYTHON</text>
    <text x="296" y="667">TOKEN FORNYES AUTOMATISK</text>
    <text x="640" y="667">KUN DANMARK</text>
  </g>
  <g fill="#3b82f6" opacity=".7"><rect x="272" y="650" width="2" height="24"/><rect x="616" y="650" width="2" height="24"/></g>
  <text x="1224" y="668" font-size="19" font-weight="700" text-anchor="end"><tspan fill="#38bdf8">github.com/</tspan><tspan fill="#ff6b76">mgjuhler/rema1000-dk</tspan></text>
</svg>
